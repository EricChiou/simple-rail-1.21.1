// T-043 evidence-only tasks. Do not modify production sourceSets or Gradle files.
gradle.projectsEvaluated {
    def p = rootProject
    def ev = p.file('docs/evidence/T-043')
    def fixture = p.tasks.register('compileT043Fixture', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source = p.fileTree(new File(ev, 'fixture')) { include '**/*.java' }
        classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output
        javaCompiler.set(p.tasks.named('compileJava', JavaCompile).get().javaCompiler)
        destinationDirectory.set(p.layout.buildDirectory.dir('t043/fixture-classes'))
        options.release.set(21)
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-proc:none', '-Xlint:deprecation', '-Werror'])
    }
    def tests = p.tasks.register('compileT043Tests', JavaCompile) {
        dependsOn fixture
        source = p.fileTree(new File(ev, 'tests')) { include '**/*.java' }
        classpath = p.sourceSets.main.compileClasspath + p.files(fixture.flatMap { it.destinationDirectory })
        javaCompiler.set(p.tasks.named('compileJava', JavaCompile).get().javaCompiler)
        destinationDirectory.set(p.layout.buildDirectory.dir('t043/test-classes'))
        options.release.set(21)
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-proc:none', '-Werror'])
    }
    p.tasks.register('testT043', JavaExec) {
        dependsOn tests
        workingDir(ev)
        classpath = p.files(tests.flatMap { it.destinationDirectory }, fixture.flatMap { it.destinationDirectory }) + p.sourceSets.main.runtimeClasspath
        mainClass.set('evidence.t043.DispenserSourceModelTest')
        javaLauncher.set(p.javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(21)) })
    }
    def metadata = p.tasks.register('prepareT043Metadata') {
        dependsOn p.tasks.named('generateModMetadata')
        doLast {
            def source = p.file('build/generated/sources/modMetadata/META-INF/neoforge.mods.toml')
            def out = p.file('build/t043/metadata/META-INF/neoforge.mods.toml')
            out.parentFile.mkdirs()
            out.text = source.getText('UTF-8').replace('displayName="Simple Rail"', 'displayName="Simple Rail [T043 diagnostic]"')
        }
    }
    p.tasks.register('t043Jar', Jar) {
        dependsOn fixture, metadata
        archiveFileName.set('simplerail-1.0.0-T043-probe.jar')
        destinationDirectory.set(p.layout.buildDirectory.dir('t043/artifacts'))
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        from(p.sourceSets.main.output) {
            exclude 'com/ericchiu/simplerail/SimpleRail.class'
            exclude 'com/ericchiu/simplerail/registry/ModBlocks.class'
            exclude 'META-INF/neoforge.mods.toml'
        }
        from(fixture.flatMap { it.destinationDirectory })
        from(p.file('build/t043/metadata'))
    }
}
