gradle.projectsEvaluated {
    def p = rootProject
    def ev = p.file('docs/evidence/T-038')
    def compileTests = p.tasks.register('compileT038Tests', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source = p.fileTree(new File(ev,'tests')) { include '**/*.java' }
        classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output
        javaCompiler.set(p.tasks.named('compileJava',JavaCompile).get().javaCompiler)
        destinationDirectory.set(p.layout.buildDirectory.dir('t038/test-classes'))
        options.release.set(21)
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-proc:none','-Xlint:deprecation','-Werror'])
        doFirst {
            new File(ev,'compile-classpath.txt').text = p.sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join('\n')+'\n'
            new File(ev,'compiler.txt').text = javaCompiler.get().metadata.toString()+'\n'
        }
    }
    p.tasks.register('testT038', JavaExec) {
        dependsOn compileTests
        workingDir(ev)
        classpath = p.files(compileTests.flatMap { it.destinationDirectory }) + p.sourceSets.main.runtimeClasspath
        javaLauncher.set(p.javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(21)) })
        mainClass.set('com.ericchiu.simplerail.blockentity.HoldingTimerTest')
    }
}
